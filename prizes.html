<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>homieOstasis · Prize Center</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#eaf6ff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="homieOstasis" />
  <link rel="apple-touch-icon" href="/images/icon-192.png" />
  <link rel="stylesheet" href="/hub.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" />
  <style>body { visibility: hidden; }</style>
</head>
<body class="hub-page">
  <div class="hub-wrapper">

    <div class="hub-header">
      <h1>Prize Center</h1>
      <span class="hub-points">⭐ 0 pts</span>
    </div>

    <div class="hub-card">
      <h2>My Toy Box</h2>
      <p>See all your treasures, collectibles, and badges.</p>
      <a href="#" class="hub-btn">Open</a>
    </div>

    <div class="hub-card-row">
      <div class="hub-card">
        <h2>Mini Prizes</h2>
        <p>Spend a few points on instant surprises.</p>
        <a href="#" class="hub-btn">Spin</a>
      </div>
    </div>

    <div class="hub-card">
      <h2>Playground Leaders</h2>
      <p>The leaderboard will show up here once points are tracked.</p>
    </div>

  </div>

  <nav class="hub-nav">
    <a href="/map.html" class="hub-nav-item">
      <span class="hub-nav-icon">🗺️</span>
      <span>Map</span>
    </a>
    <a href="/prizes.html" class="hub-nav-item active">
      <span class="hub-nav-icon">🏆</span>
      <span>Prize Center</span>
    </a>
    <a href="/home.html" class="hub-nav-item hub-nav-center">
      <span class="hub-nav-icon">🌻</span>
    </a>
    <a href="/homies.html" class="hub-nav-item">
      <span class="hub-nav-icon">🤝</span>
      <span>Homies</span>
    </a>
    <a href="/profile.html" class="hub-nav-item">
      <span class="hub-nav-icon">👤</span>
      <span>Profile</span>
    </a>
  </nav>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
    }
  </script>

  <script type="module">
    import { requireAuth } from '/auth.js';
    requireAuth().then(({ profile }) => {
      const el = document.querySelector('.hub-points');
      if (el) el.textContent = `⭐ ${profile.points ?? 0} pts`;
      document.body.style.visibility = 'visible';
    });
  </script>
</body>
</html>
