<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>You're In · homieOstasis</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#72c8e8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="apple-touch-icon" href="images/icon-192.png" />
  <link rel="stylesheet" href="entry.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" />
  <style>
    /* ── Password page ── */

    #brand-logo {
      width: 60%;
      max-width: 210px;
      margin-bottom: 6px;
    }

    .scene-wrapper {
      width: 100%;
      max-width: 320px;
      margin: 0 auto;
    }

    /* Rainbow arcs draw in */
    .arc {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: drawArc 0.65s ease-out forwards;
    }
    .arc:nth-child(1) { animation-delay: 0.00s; }
    .arc:nth-child(2) { animation-delay: 0.07s; }
    .arc:nth-child(3) { animation-delay: 0.14s; }
    .arc:nth-child(4) { animation-delay: 0.21s; }
    .arc:nth-child(5) { animation-delay: 0.28s; }
    .arc:nth-child(6) { animation-delay: 0.35s; }
    .arc:nth-child(7) { animation-delay: 0.42s; }

    @keyframes drawArc {
      to { stroke-dashoffset: 0; }
    }

    /* "FUNemployed" text fades in after arcs finish */
    .arc-label {
      opacity: 0;
      animation: fadeIn 0.4s ease-out 0.9s forwards;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    /* Cloud pops in */
    .cloud {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: bottom right;
      animation: popIn 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) 0.85s forwards;
    }

    /* Briefcase bounces in */
    .briefcase-group {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: bottom left;
      animation: popIn 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) 1.0s forwards;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.4); }
      to   { opacity: 1; transform: scale(1); }
    }

    /* Briefcase lid opens */
    .case-lid {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: openLid 0.35s ease-out 1.5s forwards;
    }

    @keyframes openLid {
      to { transform: rotate(-55deg); }
    }

    /* Money bills pop out */
    .bill {
      opacity: 0;
    }
    .bill-1 { animation: billPop 0.3s ease-out 1.65s forwards; }
    .bill-2 { animation: billPop 0.3s ease-out 1.75s forwards; }
    .bill-3 { animation: billPop 0.3s ease-out 1.85s forwards; }

    @keyframes billPop {
      from { opacity: 0; transform: translateY(6px) scale(0.8); }
      to   { opacity: 1; transform: translateY(0)  scale(1); }
    }

    /* Password card fades up */
    .pw-reveal {
      opacity: 0;
      animation: fadeUp 0.5s ease-out 2.0s forwards;
      background: rgba(255, 255, 255, 0.93);
      border-radius: 18px;
      padding: 16px 18px 18px;
      margin-top: 8px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.1);
      text-align: center;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .pw-label {
      font-family: 'Nunito', sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      color: #777;
      margin-bottom: 6px;
    }

    .pw-value {
      font-family: 'Nunito', sans-serif;
      font-size: 1.7rem;
      font-weight: 900;
      color: #4a0080;
      letter-spacing: 0.02em;
      margin-bottom: 3px;
    }

    .pw-case-note {
      font-family: 'Nunito', sans-serif;
      font-size: 0.72rem;
      font-weight: 500;
      color: #aaa;
      margin-bottom: 14px;
    }

    .tap-in-btn {
      display: inline-block;
      background: #d946a8;
      color: #fff;
      font-family: 'Nunito', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 10px 26px;
      border-radius: 50px;
      text-decoration: none;
      transition: background 0.15s;
    }

    .tap-in-btn:hover { background: #c0389a; }
  </style>
</head>
<body class="entry-page">

  <div id="page-wrapper">
    <img id="bg-art" src="images/playground-entrance.png" alt="" />

    <div id="entry-content">
      <img id="brand-logo" src="images/homieostasis-logo.png" alt="homieOstasis energy playground" />

      <div class="scene-wrapper">

        <svg viewBox="0 0 300 185" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;overflow:visible;">
          <defs>
            <path id="arc-path" d="M 42 178 Q 150 28 258 178"/>
          </defs>

          <!-- Rainbow arcs outer → inner -->
          <path class="arc" d="M 10 182 Q 150 -8  290 182" stroke="#FF0000" stroke-width="19" fill="none" stroke-linecap="round"/>
          <path class="arc" d="M 23 182 Q 150 10  277 182" stroke="#FF8C00" stroke-width="19" fill="none" stroke-linecap="round"/>
          <path class="arc" d="M 36 182 Q 150 28  264 182" stroke="#FFE600" stroke-width="19" fill="none" stroke-linecap="round"/>
          <path class="arc" d="M 49 182 Q 150 46  251 182" stroke="#00CC44" stroke-width="19" fill="none" stroke-linecap="round"/>
          <path class="arc" d="M 62 182 Q 150 64  238 182" stroke="#0066FF" stroke-width="19" fill="none" stroke-linecap="round"/>
          <path class="arc" d="M 75 182 Q 150 82  225 182" stroke="#4B0082" stroke-width="19" fill="none" stroke-linecap="round"/>
          <path class="arc" d="M 88 182 Q 150 100 212 182" stroke="#9400D3" stroke-width="19" fill="none" stroke-linecap="round"/>

          <!-- "FUNemployed" text curved along the rainbow -->
          <text class="arc-label"
                font-family="'Nunito', sans-serif"
                font-weight="900"
                font-size="16"
                fill="white"
                stroke="#1a1a1a"
                stroke-width="3"
                paint-order="stroke">
            <textPath href="#arc-path" startOffset="50%" text-anchor="middle" letter-spacing="2">
              FUNemployed!
            </textPath>
          </text>

          <!-- Cloud — left base -->
          <g class="cloud">
            <ellipse cx="40"  cy="174" rx="26" ry="17" fill="white" stroke="#ddd" stroke-width="1.5"/>
            <ellipse cx="22"  cy="179" rx="17" ry="12" fill="white" stroke="#ddd" stroke-width="1.5"/>
            <ellipse cx="60"  cy="177" rx="19" ry="13" fill="white" stroke="#ddd" stroke-width="1.5"/>
          </g>

          <!-- Briefcase — right base -->
          <g class="briefcase-group">
            <!-- Case body -->
            <rect x="237" y="155" width="56" height="38" rx="5" fill="#1a1a1a" stroke="#000" stroke-width="2"/>
            <!-- Clasp -->
            <rect x="257" y="153" width="14" height="8"  rx="2" fill="#888" stroke="#555" stroke-width="1"/>
            <!-- Money bills (revealed after lid opens) -->
            <g transform-box="fill-box">
              <rect class="bill bill-1" x="241" y="149" width="17" height="10" rx="1"
                    fill="#4CAF50" stroke="#2e7d32" stroke-width="1"
                    transform="rotate(-12, 249, 154)"/>
              <rect class="bill bill-2" x="254" y="147" width="17" height="10" rx="1"
                    fill="#66BB6A" stroke="#2e7d32" stroke-width="1"
                    transform="rotate(3, 262, 152)"/>
              <rect class="bill bill-3" x="265" y="150" width="17" height="10" rx="1"
                    fill="#4CAF50" stroke="#2e7d32" stroke-width="1"
                    transform="rotate(14, 273, 155)"/>
            </g>
            <!-- Lid (animates open) -->
            <g class="case-lid">
              <rect x="237" y="141" width="56" height="16" rx="5" fill="#2a2a2a" stroke="#000" stroke-width="2"/>
              <!-- Handle -->
              <path d="M 252 141 Q 252 133 265 133 Q 278 133 278 141"
                    stroke="#666" stroke-width="3" fill="none" stroke-linecap="round"/>
            </g>
          </g>
        </svg>

        <!-- Password reveal card -->
        <div class="pw-reveal">
          <p class="pw-label">your password is:</p>
          <p class="pw-value">FUNemployed!</p>
          <p class="pw-case-note">case sensitive ✨</p>
          <a href="/" class="tap-in-btn">← Back to the Playground</a>
        </div>

      </div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
    }

    // ── Confetti ──
    // Fires when the password card becomes visible (~2s after page load)
    function launchConfetti() {
      const colors = ['#FF0000','#FF8C00','#FFE600','#00CC44','#0066FF','#9400D3','#FF6BA8','#ffffff'];
      const count  = 120;
      const canvas = document.createElement('canvas');
      canvas.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:999;';
      document.body.appendChild(canvas);
      const ctx = canvas.getContext('2d');
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;

      const pieces = Array.from({ length: count }, () => ({
        x:     Math.random() * canvas.width,
        y:     Math.random() * -canvas.height,
        w:     6 + Math.random() * 8,
        h:     4 + Math.random() * 5,
        color: colors[Math.floor(Math.random() * colors.length)],
        rot:   Math.random() * Math.PI * 2,
        spin:  (Math.random() - 0.5) * 0.2,
        vy:    3 + Math.random() * 4,
        vx:    (Math.random() - 0.5) * 2,
      }));

      let frame;
      let done = false;

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pieces.forEach(p => {
          p.y   += p.vy;
          p.x   += p.vx;
          p.rot += p.spin;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();
        });
        if (!done) frame = requestAnimationFrame(draw);
      }

      draw();
      // Stop after 3.5s and fade out
      setTimeout(() => {
        done = true;
        canvas.style.transition = 'opacity 0.8s';
        canvas.style.opacity = '0';
        setTimeout(() => canvas.remove(), 800);
      }, 3500);
    }

    // Fire confetti when the password card animates in
    setTimeout(launchConfetti, 2000);
  </script>

</body>
</html>
