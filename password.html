<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>You're In · homieOstasis</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#72c8e8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="apple-touch-icon" href="images/icon-192.png" />
  <link rel="stylesheet" href="entry.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" />
</head>
<body class="entry-page">

  <div id="page-wrapper">
    <img id="bg-art" src="images/playground-entrance.png" alt="" />

    <div id="entry-content">
      <img id="brand-logo" src="images/homieostasis-logo.png" alt="homieOstasis energy playground" />

      <div class="password-card">
        <p class="password-label">You're confirmed! Here's your password:</p>
        <p class="password-value">
          <!-- REPLACE WITH YOUR ACTUAL PASSWORD -->
          ✨ homie ✨
        </p>
        <p class="password-hint">Head back and enter it to get in.</p>
        <a href="/" class="tap-in-btn">Tap In →</a>
      </div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
    }
  </script>

</body>
</html>
