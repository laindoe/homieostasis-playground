<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Sign In · homieOstasis</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#eaf6ff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="homieOstasis" />
  <link rel="apple-touch-icon" href="/images/icon-192.png" />
  <link rel="stylesheet" href="/login.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" />
</head>
<body class="login-page">

  <div class="login-container">

    <img src="/images/homieostasis-logo.png" alt="homieOstasis" class="login-logo" />

    <div class="login-card">
      <h1 class="login-title">Welcome, Homie 🌻</h1>

      <button class="google-btn" id="google-btn" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="20" height="20">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Continue with Google
      </button>

      <div class="login-divider"><span>or</span></div>

      <div class="login-tabs" role="tablist">
        <button class="login-tab active" id="tab-signin" role="tab" aria-selected="true">Sign In</button>
        <button class="login-tab" id="tab-signup" role="tab" aria-selected="false">Create Account</button>
      </div>

      <form id="login-form" novalidate>

        <div class="login-field" id="field-name" style="display:none">
          <label for="input-name">Your Name</label>
          <input id="input-name" type="text" class="login-input" placeholder="Homie McHomie" autocomplete="name" />
        </div>

        <div class="login-field">
          <label for="input-email">Email</label>
          <input id="input-email" type="email" class="login-input" placeholder="you@example.com" autocomplete="email" required />
        </div>

        <div class="login-field">
          <label for="input-password">Password</label>
          <input id="input-password" type="password" class="login-input" placeholder="••••••••" autocomplete="current-password" required />
        </div>

        <p id="login-error" class="login-error" aria-live="polite"></p>

        <button type="submit" class="login-btn" id="submit-btn">Sign In</button>
      </form>

      <a href="#" id="forgot-link" class="login-forgot">Forgot your password?</a>
    </div>

    <p class="login-footer">A judgment-free zone, always ✨</p>

  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
    }
  </script>

  <script type="module">
    import { auth } from '/firebase-config.js';
    import {
      onAuthStateChanged,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      updateProfile,
      sendPasswordResetEmail,
      signInWithRedirect,
      getRedirectResult,
      GoogleAuthProvider
    } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
    import { ensureUserProfile } from '/auth.js';

    const provider = new GoogleAuthProvider();

    getRedirectResult(auth).then(result => {
      if (result?.user) return ensureUserProfile(result.user);
    }).catch(err => showMsg(friendlyError(err.code)));

    onAuthStateChanged(auth, user => {
      if (user) window.location.replace('/map.html');
    });

    document.getElementById('google-btn').addEventListener('click', () => {
      signInWithRedirect(auth, provider);
    });

    let isSignUp = false;

    document.getElementById('tab-signin').addEventListener('click', () => {
      isSignUp = false;
      document.getElementById('tab-signin').classList.add('active');
      document.getElementById('tab-signup').classList.remove('active');
      document.getElementById('field-name').style.display = 'none';
      document.getElementById('submit-btn').textContent = 'Sign In';
      document.getElementById('input-password').setAttribute('autocomplete', 'current-password');
      clearMsg();
    });

    document.getElementById('tab-signup').addEventListener('click', () => {
      isSignUp = true;
      document.getElementById('tab-signup').classList.add('active');
      document.getElementById('tab-signin').classList.remove('active');
      document.getElementById('field-name').style.display = 'block';
      document.getElementById('submit-btn').textContent = 'Create Account';
      document.getElementById('input-password').setAttribute('autocomplete', 'new-password');
      clearMsg();
    });

    document.getElementById('login-form').addEventListener('submit', async e => {
      e.preventDefault();
      clearMsg();

      const email    = document.getElementById('input-email').value.trim();
      const password = document.getElementById('input-password').value;
      const name     = document.getElementById('input-name').value.trim();

      if (!email || !password) { showMsg('Please fill in your email and password.'); return; }
      if (isSignUp && password.length < 6) { showMsg('Password must be at least 6 characters.'); return; }

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.textContent = isSignUp ? 'Creating account…' : 'Signing in…';

      try {
        let cred;
        if (isSignUp) {
          cred = await createUserWithEmailAndPassword(auth, email, password);
          if (name) await updateProfile(cred.user, { displayName: name });
        } else {
          cred = await signInWithEmailAndPassword(auth, email, password);
        }
        await ensureUserProfile(cred.user);
        window.location.replace('/map.html');
      } catch (err) {
        btn.disabled = false;
        btn.textContent = isSignUp ? 'Create Account' : 'Sign In';
        showMsg(friendlyError(err.code));
      }
    });

    document.getElementById('forgot-link').addEventListener('click', async e => {
      e.preventDefault();
      const email = document.getElementById('input-email').value.trim();
      if (!email) { showMsg('Enter your email above first.'); return; }
      try {
        await sendPasswordResetEmail(auth, email);
        showMsg('Reset email sent — check your inbox!', 'success');
      } catch (err) {
        showMsg(friendlyError(err.code));
      }
    });

    function showMsg(msg, type = 'error') {
      const el = document.getElementById('login-error');
      el.textContent = msg;
      el.className = 'login-error' + (type === 'success' ? ' login-success' : '');
    }

    function clearMsg() {
      const el = document.getElementById('login-error');
      el.textContent = '';
      el.className = 'login-error';
    }

    function friendlyError(code) {
      const map = {
        'auth/invalid-email':          "That email doesn't look right.",
        'auth/user-not-found':         "No account found with that email.",
        'auth/wrong-password':         "Wrong password — try again.",
        'auth/invalid-credential':     "Email or password is incorrect.",
        'auth/email-already-in-use':   "An account with that email already exists.",
        'auth/weak-password':          "Password needs to be at least 6 characters.",
        'auth/too-many-requests':      "Too many attempts. Try again in a bit.",
        'auth/network-request-failed': "Network error — check your connection.",
        'auth/popup-blocked':          "Popup was blocked — try again.",
        'auth/cancelled-popup-request':"Sign-in cancelled.",
        'auth/unauthorized-domain':    "This domain isn't authorized in Firebase yet.",
      };
      return map[code] || 'Something went wrong. Try again.';
    }
  </script>

</body>
</html>
