<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>You're In · homieOstasis</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#72c8e8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="apple-touch-icon" href="/images/icon-192.png" />
  <link rel="stylesheet" href="entry.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" />
  <style>
    /* ── Password page ── */

    #brand-logo {
      width: 60%;
      max-width: 210px;
      margin-bottom: 6px;
    }

    .scene-wrapper {
      width: 100%;
      max-width: 320px;
      margin: 0 auto;
    }

    /* Banner pops in */
    .funemployed-banner {
      width: 100%;
      display: block;
      opacity: 0;
      animation: popIn 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s forwards;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.85); }
      to   { opacity: 1; transform: scale(1); }
    }

    /* Password card fades up */
    .pw-reveal {
      opacity: 0;
      animation: fadeUp 0.5s ease-out 2.0s forwards;
      background: rgba(255, 255, 255, 0.93);
      border-radius: 18px;
      padding: 16px 18px 18px;
      margin-top: 8px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.1);
      text-align: center;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .pw-label {
      font-family: 'Nunito', sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      color: #777;
      margin-bottom: 6px;
    }

    .pw-value {
      font-family: 'Nunito', sans-serif;
      font-size: 1.7rem;
      font-weight: 900;
      color: #4a0080;
      letter-spacing: 0.02em;
      margin-bottom: 3px;
    }

    .pw-case-note {
      font-family: 'Nunito', sans-serif;
      font-size: 0.72rem;
      font-weight: 500;
      color: #aaa;
      margin-bottom: 14px;
    }

    .tap-in-btn {
      display: inline-block;
      background: #d946a8;
      color: #fff;
      font-family: 'Nunito', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 10px 26px;
      border-radius: 50px;
      text-decoration: none;
      transition: background 0.15s;
    }

    .tap-in-btn:hover { background: #c0389a; }
  </style>
</head>
<body class="entry-page">

  <div id="page-wrapper">
    <img id="bg-art" src="/images/playground-entrance.png" alt="" />

    <div id="entry-content">
      <img id="brand-logo" src="/images/homieostasis-logo.png" alt="homieOstasis energy playground" />

      <div class="scene-wrapper">

        <img src="/images/funemployed-banner.png" class="funemployed-banner" alt="FUNemployed!" />

        <!-- Password reveal card -->
        <div class="pw-reveal">
          <p class="pw-label">your password is:</p>
          <p class="pw-value">FUNemployed!</p>
          <p class="pw-case-note">case sensitive ✨</p>
          <a href="enter.html" class="tap-in-btn">← Back to the Playground</a>
        </div>

      </div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
    }

    // ── Confetti ──
    // Fires when the password card becomes visible (~2s after page load)
    function launchConfetti() {
      const colors = ['#FF0000','#FF8C00','#FFE600','#00CC44','#0066FF','#9400D3','#FF6BA8','#ffffff'];
      const count  = 120;
      const canvas = document.createElement('canvas');
      canvas.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:999;';
      document.body.appendChild(canvas);
      const ctx = canvas.getContext('2d');
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;

      const pieces = Array.from({ length: count }, () => ({
        x:     Math.random() * canvas.width,
        y:     Math.random() * -canvas.height,
        w:     6 + Math.random() * 8,
        h:     4 + Math.random() * 5,
        color: colors[Math.floor(Math.random() * colors.length)],
        rot:   Math.random() * Math.PI * 2,
        spin:  (Math.random() - 0.5) * 0.2,
        vy:    3 + Math.random() * 4,
        vx:    (Math.random() - 0.5) * 2,
      }));

      let frame;
      let done = false;

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pieces.forEach(p => {
          p.y   += p.vy;
          p.x   += p.vx;
          p.rot += p.spin;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();
        });
        if (!done) frame = requestAnimationFrame(draw);
      }

      draw();
      // Stop after 3.5s and fade out
      setTimeout(() => {
        done = true;
        canvas.style.transition = 'opacity 0.8s';
        canvas.style.opacity = '0';
        setTimeout(() => canvas.remove(), 800);
      }, 3500);
    }

    // Fire confetti when the password card animates in
    setTimeout(launchConfetti, 2000);
  </script>

</body>
</html>
