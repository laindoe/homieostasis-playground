<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>homieOstasis energy playground</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#72c8e8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="homieOstasis" />
  <link rel="apple-touch-icon" href="images/icon-192.png" />
  <link rel="stylesheet" href="entry.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Nunito:wght@700;800&display=swap" />
</head>
<body class="entry-page">

  <div id="page-wrapper">
    <img id="bg-art" src="images/playground-entrance.png" alt="homieOstasis Energy Playground" />

    <div id="entry-content">

      <!-- Branding -->
      <header id="entry-header">
        <img id="brand-logo" src="images/homieostasis-logo.png" alt="homieOstasis energy playground" />
        <p class="tagline">Find Yourself. Find Your Homies.</p>
      </header>

      <hr class="rule" />

      <!-- Invite code entry -->
      <section id="entry-form-section">
        <h2>What's the password?</h2>
        <form id="invite-form">
          <div class="invite-input-row">
            <input id="invite-input" type="text" placeholder="Enter Invite Code" autocomplete="off" />
            <button type="submit" class="invite-submit" aria-label="Submit">›</button>
          </div>
        </form>
        <a href="#" id="request-invite-link">Request Invitation</a>
      </section>

      <!-- While You Wait -->
      <section id="while-you-wait">
        <h3>While You Wait...</h3>

        <a href="playground.html" class="wait-card">
          <div class="wait-card-icon">
            <!-- Map icon -->
            <svg viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect width="44" height="44" rx="10" fill="#F5EDD0"/>
              <rect x="5" y="7" width="34" height="30" rx="3" fill="#EDE3C0" stroke="#9A7B45" stroke-width="1.5"/>
              <line x1="5" y1="17" x2="39" y2="17" stroke="#D4C090" stroke-width="0.8"/>
              <line x1="5" y1="26" x2="39" y2="26" stroke="#D4C090" stroke-width="0.8"/>
              <line x1="16" y1="7" x2="16" y2="37" stroke="#D4C090" stroke-width="0.8"/>
              <line x1="28" y1="7" x2="28" y2="37" stroke="#D4C090" stroke-width="0.8"/>
              <path d="M9 31 Q13 27 16 23 Q19 19 22 15 Q25 11 30 11 Q34 11 36 14"
                    stroke="#E05050" stroke-width="2.5" fill="none"
                    stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="9" cy="31" r="3" fill="#4CAF50" stroke="#333" stroke-width="1"/>
              <circle cx="36" cy="14" r="3" fill="#E05050" stroke="#333" stroke-width="1"/>
            </svg>
          </div>
          <div class="wait-card-text">
            <strong>Explore the Playground</strong>
            <span>View the map</span>
          </div>
          <div class="wait-card-arrow">›</div>
        </a>

        <a href="homies.html" class="wait-card">
          <div class="wait-card-icon">
            <!-- Flower character icon -->
            <svg viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect width="44" height="44" rx="10" fill="#EAF7EA"/>
              <ellipse cx="22" cy="9"  rx="4"   ry="6.5" fill="#F0E040" stroke="#333" stroke-width="1.2"/>
              <ellipse cx="35" cy="22" rx="6.5" ry="4"   fill="#F0E040" stroke="#333" stroke-width="1.2"/>
              <ellipse cx="22" cy="35" rx="4"   ry="6.5" fill="#F0E040" stroke="#333" stroke-width="1.2"/>
              <ellipse cx="9"  cy="22" rx="6.5" ry="4"   fill="#F0E040" stroke="#333" stroke-width="1.2"/>
              <ellipse cx="31" cy="12" rx="5"   ry="3"   fill="#F0E040" stroke="#333" stroke-width="1.2" transform="rotate(-45 31 12)"/>
              <ellipse cx="32" cy="32" rx="5"   ry="3"   fill="#F0E040" stroke="#333" stroke-width="1.2" transform="rotate(45 32 32)"/>
              <ellipse cx="12" cy="32" rx="5"   ry="3"   fill="#F0E040" stroke="#333" stroke-width="1.2" transform="rotate(-45 12 32)"/>
              <ellipse cx="12" cy="12" rx="5"   ry="3"   fill="#F0E040" stroke="#333" stroke-width="1.2" transform="rotate(45 12 12)"/>
              <circle cx="22" cy="22" r="9" fill="#8B5E3C" stroke="#333" stroke-width="1.5"/>
              <path d="M18 20 Q19 18 20 20" stroke="#FF6BA8" stroke-width="1.4" fill="none" stroke-linecap="round"/>
              <path d="M24 20 Q25 18 26 20" stroke="#FF6BA8" stroke-width="1.4" fill="none" stroke-linecap="round"/>
              <path d="M19.5 23 Q22 25.5 24.5 23" stroke="#FF6BA8" stroke-width="1.4" fill="none" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="wait-card-text">
            <strong>Meet the Healing Homies</strong>
            <span>Get to know the crew</span>
          </div>
          <div class="wait-card-arrow">›</div>
        </a>

      </section>
    </div>
  </div>

  <!-- Email capture modal -->
  <div id="invite-modal">
    <div class="modal-sheet">
      <button class="modal-close-btn" id="modal-close" aria-label="Close">×</button>

      <div id="kit-form-embed">
        
        <script async data-uid="6532025544" src="https://homieostasis.kit.com/6532025544/index.js"></script>
        
        
      </div>

    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
    }

    // Invite code submit — redirect on any non-empty code for now
    document.getElementById('invite-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const code = document.getElementById('invite-input').value.trim();
      if (code) {
        // TODO: validate code against allowed list before redirecting
        window.location.href = 'playground.html';
      }
    });

    // Modal controls
    const modal = document.getElementById('invite-modal');

    document.getElementById('request-invite-link').addEventListener('click', function (e) {
      e.preventDefault();
      modal.classList.add('open');
    });

    document.getElementById('modal-close').addEventListener('click', function () {
      modal.classList.remove('open');
    });

    modal.addEventListener('click', function (e) {
      if (e.target === modal) modal.classList.remove('open');
    });

  </script>

</body>
</html>
